[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nanio-orchestrator"
version = "0.5.0"
description = "Nginx configuration manager and gateway orchestrator for nanio S3-compatible storage clusters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Nuno Kisc", email = "nuno@kisc.pt" }]
keywords = ["nginx", "s3", "storage", "orchestrator", "nanio", "gateway"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "aiosqlite>=0.20",
  "jinja2>=3.1",
  "pydantic-settings>=2.2",
  "click>=8.1",
  "aiofiles>=23.2",
  "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/nunokisc/nanio-orchestrator"
Repository = "https://github.com/nunokisc/nanio-orchestrator"
Documentation = "https://github.com/nunokisc/nanio-orchestrator/tree/main/docs"
"Bug Tracker" = "https://github.com/nunokisc/nanio-orchestrator/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.scripts]
nanio-orchestrator = "nanio_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["nanio_orchestrator*"]

[tool.setuptools.package-data]
"nanio_orchestrator" = [
    # the web panel, built from ui/ by `make ui` (not in git)
    "web/dist/*",
    "web/dist/assets/*",
    "nginx/templates/*.j2",
]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["nanio_orchestrator", "tests"]

[tool.ruff.lint]
# Same rule set as nanio.
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # arrows, dashes and box-drawing characters in text are intended
]

[tool.ruff.lint.pyupgrade]
# Python 3.9 is supported and Pydantic evaluates annotations at runtime:
# `X | None` and `list[int]` in a model would fail there.
keep-runtime-typing = true

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parts through calls in argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["nanio_orchestrator"]
branch = true

[tool.coverage.report]
# 100% of statements and branches is enforced: `pytest --cov` fails below it.
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
